<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Password Reset Request - OPQ Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(120deg, #181c24 0%, #232a34 60%, #1a1d2b 100%);
            color: #f5f6fa;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .reset-container {
            background: #232a34;
            border-radius: 18px;
            box-shadow: 0 4px 24px 0 rgba(0,0,0,0.18);
            padding: 2.5rem 2.5rem 2rem 2.5rem;
            max-width: 400px;
            width: 100%;
        }
        .reset-header {
            font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: #5bc0de;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .form-label, .form-control {
            color: #f5f6fa;
        }
        .form-control {
            background: #232a34;
            border: 1px solid #444;
            border-radius: 8px;
        }
        .form-control:focus {
            background: #232a34;
            color: #f5f6fa;
            border-color: #5bc0de;
        }
        .btn-info {
            background: #5bc0de;
            border: none;
        }
        .btn-info:hover {
            background: #31b0d5;
        }
        .login-link {
            color: #5bc0de;
            text-decoration: none;
        }
        .login-link:hover {
            text-decoration: underline;
        }
        #toastContainer {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            z-index: 1080;
        }
    </style>
</head>
<body>
<div class="reset-container">
    <div class="reset-header">Password Reset</div>
    <form id="resetRequestForm">
        <div class="mb-3">
            <label for="resetUsername" class="form-label">Username</label>
            <input type="text" class="form-control" id="resetUsername" name="username" required autocomplete="username" aria-label="Username">
        </div>
        <button type="submit" class="btn btn-info w-100 mb-2">Request Reset</button>
        <div class="text-center">
            <a th:href="@{/login}" class="login-link">Back to Login</a>
        </div>
    </form>
    <div id="resetLinkContainer" class="mt-3 text-center"></div>
</div>
<div id="toastContainer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function showToast(message, type = 'info') {
        const toastId = 'toast-' + Date.now();
        const icon = type === 'success' ? 'bi-check-circle-fill' : type === 'error' ? 'bi-x-circle-fill' : 'bi-info-circle-fill';
        const bg = type === 'success' ? 'bg-success' : type === 'error' ? 'bg-danger' : 'bg-info';
        const html = `<div id="${toastId}" class="toast align-items-center text-white ${bg} border-0 mb-2" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body"><i class="bi ${icon} me-2"></i>${message}</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>`;
        const container = document.getElementById('toastContainer');
        container.insertAdjacentHTML('beforeend', html);
        const toastEl = document.getElementById(toastId);
        const toast = new bootstrap.Toast(toastEl, { delay: 3500 });
        toast.show();
        toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
    }
    document.getElementById('resetRequestForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const username = document.getElementById('resetUsername').value.trim();
        fetch('/api/password-reset/request', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `username=${encodeURIComponent(username)}`
        })
        .then(resp => resp.text())
        .then(text => {
            showToast('If the user exists, a reset link will be provided.', 'info');
            if (text.startsWith('Reset link:')) {
                const url = text.replace('Reset link:', '').trim();
                document.getElementById('resetLinkContainer').innerHTML = `<div class='alert alert-info d-inline-block text-break' style='max-width: 100%; word-break: break-all;'>Reset link: <a href='${url}' target='_blank' rel='noopener noreferrer'>${url}</a></div>`;
            } else {
                document.getElementById('resetLinkContainer').innerHTML = '';
            }
        })
        .catch(() => {
            showToast('Failed to request password reset.', 'error');
        });
    });
    window.onload = function() {
        document.getElementById('resetUsername').focus();
    };
</script>
</body>
</html>
