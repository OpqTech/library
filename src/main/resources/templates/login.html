<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - OPQ Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(120deg, #181c24 0%, #232a34 60%, #1a1d2b 100%);
            color: #f5f6fa;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: #232a34;
            border-radius: 18px;
            box-shadow: 0 4px 24px 0 rgba(0,0,0,0.18);
            padding: 2.5rem 2.5rem 2rem 2.5rem;
            max-width: 400px;
            width: 100%;
        }
        .login-header {
            font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: #5bc0de;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .form-label, .form-control {
            color: #f5f6fa;
        }
        .form-control {
            background: #232a34;
            border: 1px solid #444;
            border-radius: 8px;
        }
        .form-control:focus {
            background: #232a34;
            color: #f5f6fa;
            border-color: #5bc0de;
        }
        .btn-info {
            background: #5bc0de;
            border: none;
        }
        .btn-info:hover {
            background: #31b0d5;
        }
        .register-link {
            color: #5bc0de;
            text-decoration: none;
        }
        .register-link:hover {
            text-decoration: underline;
        }
        .alert {
            margin-bottom: 1rem;
        }
        .input-group .form-control {
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
        }
        .input-group .btn {
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
            height: 100%;
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-header">OPQ Library Login</div>
    <form th:action="@{/login}" method="post" id="loginForm">
        <div th:if="${param.error}" class="alert alert-danger" role="alert">
            Invalid username or password.
        </div>
        <div th:if="${param.logout}" class="alert alert-success" role="alert">
            You have been logged out.
        </div>
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" required autofocus autocomplete="username" aria-label="Username">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
                <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password" aria-label="Password">
                <button type="button" class="btn btn-outline-secondary" id="togglePassword" tabindex="-1" aria-label="Show or hide password"><i class="bi bi-eye"></i></button>
            </div>
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe" name="remember-me">
            <label class="form-check-label" for="rememberMe">Remember Me</label>
        </div>
        <button type="submit" class="btn btn-info w-100 mb-2">Login</button>
        <div class="text-center">
            <a th:href="@{/register}" class="register-link">Don't have an account? Register</a>
        </div>
        <div class="text-center mt-2">
            <a th:href="@{/password-reset-request}" class="register-link">Forgot password?</a>
        </div>
    </form>
</div>
<script>
// Show/hide password toggle
const passwordInput = document.getElementById('password');
const togglePassword = document.getElementById('togglePassword');
togglePassword.addEventListener('click', function() {
    const type = passwordInput.type === 'password' ? 'text' : 'password';
    passwordInput.type = type;
    this.innerHTML = type === 'password' ? '<i class="bi bi-eye"></i>' : '<i class="bi bi-eye-slash"></i>';
});
// Focus username on load
window.onload = function() {
    document.getElementById('username').focus();
};
</script>
</body>
</html>
