<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - OPQ Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(120deg, #181c24 0%, #232a34 60%, #1a1d2b 100%);
            color: #f5f6fa;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-container {
            background: #232a34;
            border-radius: 18px;
            box-shadow: 0 4px 24px 0 rgba(0,0,0,0.18);
            padding: 2.5rem 2.5rem 2rem 2.5rem;
            max-width: 400px;
            width: 100%;
        }
        .register-header {
            font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: #5bc0de;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .form-label, .form-control {
            color: #f5f6fa;
        }
        .form-control {
            background: #232a34;
            border: 1px solid #444;
            border-radius: 8px;
        }
        .form-control:focus {
            background: #232a34;
            color: #f5f6fa;
            border-color: #5bc0de;
        }
        .btn-info {
            background: #5bc0de;
            border: none;
        }
        .btn-info:hover {
            background: #31b0d5;
        }
        .login-link {
            color: #5bc0de;
            text-decoration: none;
        }
        .login-link:hover {
            text-decoration: underline;
        }
        .alert {
            margin-bottom: 1rem;
        }
        #toastContainer {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            z-index: 1080;
        }
        .input-group .form-control {
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
        }
        .input-group .btn {
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
            height: 100%;
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>
<div class="register-container">
    <div class="register-header">Register for OPQ Library</div>
    <form id="registerForm">
        <div class="mb-3">
            <label for="registerUsername" class="form-label">Username</label>
            <input type="text" class="form-control" id="registerUsername" name="username" required minlength="3" maxlength="32" autocomplete="username" aria-label="Username">
        </div>
        <div class="mb-3">
            <label for="registerPassword" class="form-label">Password</label>
            <div class="input-group">
                <input type="password" class="form-control" id="registerPassword" name="password" required minlength="6" maxlength="64" autocomplete="new-password" aria-label="Password">
                <button type="button" class="btn btn-outline-secondary" id="togglePassword" tabindex="-1" aria-label="Show or hide password"><i class="bi bi-eye"></i></button>
            </div>
            <div class="progress mt-2" style="height: 6px;">
                <div id="passwordStrength" class="progress-bar" role="progressbar" style="width: 0%;"></div>
            </div>
        </div>
        <div class="mb-3">
            <label for="registerConfirmPassword" class="form-label">Confirm Password</label>
            <div class="input-group">
                <input type="password" class="form-control" id="registerConfirmPassword" name="confirmPassword" required minlength="6" maxlength="64" autocomplete="new-password" aria-label="Confirm Password">
                <button type="button" class="btn btn-outline-secondary" id="toggleConfirmPassword" tabindex="-1" aria-label="Show or hide confirm password"><i class="bi bi-eye"></i></button>
            </div>
            <div id="passwordMatchFeedback" class="form-text text-danger d-none">Passwords do not match.</div>
        </div>
        <button type="submit" class="btn btn-info w-100 mb-2">Register</button>
        <div class="text-center">
            <a th:href="@{/login}" class="login-link">Already have an account? Login</a>
        </div>
    </form>
</div>
<div id="toastContainer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function showToast(message, type = 'info') {
        const toastId = 'toast-' + Date.now();
        const icon = type === 'success' ? 'bi-check-circle-fill' : type === 'error' ? 'bi-x-circle-fill' : 'bi-info-circle-fill';
        const bg = type === 'success' ? 'bg-success' : type === 'error' ? 'bg-danger' : 'bg-info';
        const html = `<div id="${toastId}" class="toast align-items-center text-white ${bg} border-0 mb-2" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body"><i class="bi ${icon} me-2"></i>${message}</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>`;
        const container = document.getElementById('toastContainer');
        container.insertAdjacentHTML('beforeend', html);
        const toastEl = document.getElementById(toastId);
        const toast = new bootstrap.Toast(toastEl, { delay: 3500 });
        toast.show();
        toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
    }
    // Show/hide password toggles
    const passwordInput = document.getElementById('registerPassword');
    const confirmPasswordInput = document.getElementById('registerConfirmPassword');
    const togglePassword = document.getElementById('togglePassword');
    const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
    togglePassword.addEventListener('click', function() {
        const type = passwordInput.type === 'password' ? 'text' : 'password';
        passwordInput.type = type;
        this.innerHTML = type === 'password' ? '<i class="bi bi-eye"></i>' : '<i class="bi bi-eye-slash"></i>';
    });
    toggleConfirmPassword.addEventListener('click', function() {
        const type = confirmPasswordInput.type === 'password' ? 'text' : 'password';
        confirmPasswordInput.type = type;
        this.innerHTML = type === 'password' ? '<i class="bi bi-eye"></i>' : '<i class="bi bi-eye-slash"></i>';
    });
    // Password strength meter
    passwordInput.addEventListener('input', function() {
        const val = passwordInput.value;
        const strengthBar = document.getElementById('passwordStrength');
        let score = 0;
        if (val.length >= 6) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;
        let percent = score * 25;
        strengthBar.style.width = percent + '%';
        strengthBar.className = 'progress-bar';
        if (score <= 1) strengthBar.classList.add('bg-danger');
        else if (score === 2) strengthBar.classList.add('bg-warning');
        else if (score >= 3) strengthBar.classList.add('bg-success');
    });
    // Password match feedback
    function checkPasswordMatch() {
        const feedback = document.getElementById('passwordMatchFeedback');
        if (confirmPasswordInput.value && passwordInput.value !== confirmPasswordInput.value) {
            feedback.classList.remove('d-none');
        } else {
            feedback.classList.add('d-none');
        }
    }
    passwordInput.addEventListener('input', checkPasswordMatch);
    confirmPasswordInput.addEventListener('input', checkPasswordMatch);
    // Focus username on load
    window.onload = function() {
        document.getElementById('registerUsername').focus();
    };
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const username = document.getElementById('registerUsername').value.trim();
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;
        if (password !== confirmPassword) {
            showToast('Passwords do not match.', 'error');
            return;
        }
        // Password strength check
        let score = 0;
        if (password.length >= 6) score++;
        if (/[A-Z]/.test(password)) score++;
        if (/[0-9]/.test(password)) score++;
        if (/[^A-Za-z0-9]/.test(password)) score++;
        if (score < 2) {
            showToast('Password is too weak.', 'error');
            return;
        }
        fetch('/api/users/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        })
        .then(resp => resp.text().then(text => ({ ok: resp.ok, text })))
        .then(({ ok, text }) => {
            if (ok) {
                showToast('Registration successful! You can now log in.', 'success');
                document.getElementById('registerForm').reset();
                setTimeout(() => window.location.href = '/login', 1200);
            } else {
                showToast(text || 'Registration failed.', 'error');
            }
        })
        .catch(err => {
            showToast('Registration failed.', 'error');
        });
    });
</script>
</body>
</html>
